[project]
name = "rags"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "datetime>=6.0",
    "faiss-cpu>=1.16.0",
    "google-search-results>=2.4.2",
    "gradio-client>=2.7.2",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "load-dotenv>=0.1.0",
    "mcp[ws]>=1.30.0,<2.0.0",
    "numpy>=2.5.4",
    "openinference-instrumentation-smolagents>=0.1.50",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.3.0",
    "smolagents[litellm,mcp]>=1.26.0",
    "torch>=2.15.0",
    "transformers>=5.24.0",
]

[project.scripts]
rags = "rags:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
